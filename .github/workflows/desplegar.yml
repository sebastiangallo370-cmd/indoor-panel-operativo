# Publica el panel en produccion.cloud desde GitHub.
# Solo corre a mano (Actions → "Desplegar a produccion.cloud" → Run workflow), nunca solo en cada push:
# así nadie publica sin querer una rama main que esté atrasada frente al servidor.
#
# Secretos que hay que crear en GitHub (Settings → Secrets and variables → Actions):
#   INDOOR_DEPLOY_KEY   llave privada SSH con acceso root al VPS (la crea y la pega el dueño, no Claude)
#   INDOOR_KNOWN_HOSTS  salida de: ssh-keyscan 179.236.66.149
# El host no es secreto y se fija abajo: 179.236.66.149.
#
# Qué copia: app/, Dockerfile, requirements.txt y los .py de la raíz. NO toca .env, secrets/, data/,
# docker-compose.yml ni el Caddyfile del servidor.
name: Desplegar a produccion.cloud

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Escribe PUBLICAR para confirmar'
        required: true

concurrency:
  group: desplegar-produccion
  cancel-in-progress: false

jobs:
  desplegar:
    if: inputs.confirmar == 'PUBLICAR'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DESTINO: /opt/asistente-reprogramaciones
      VPS_HOST: 179.236.66.149
    steps:
      - uses: actions/checkout@v4

      - name: Revisar sintaxis antes de publicar
        run: |
          python -W ignore -c "import ast,glob;[ast.parse(open(f,encoding='utf-8-sig').read(),f) for f in glob.glob('app/*.py')+glob.glob('*.py')]"
          for f in app/*.js; do node --check "$f"; done

      - name: Preparar SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.INDOOR_DEPLOY_KEY }}" > ~/.ssh/id_vps
          chmod 600 ~/.ssh/id_vps
          printf '%s\n' "${{ secrets.INDOOR_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Copiar archivos al servidor
        run: |
          rsync -rlptz --checksum -e "ssh -i ~/.ssh/id_vps" \
            --exclude '__pycache__/' --exclude 'FORMATO_EXCEL.xlsx' --exclude 'usuarios_panel.html' \
            app/ root@$VPS_HOST:$DESTINO/app/
          rsync -ptz --checksum -e "ssh -i ~/.ssh/id_vps" \
            Dockerfile requirements.txt monitor_archivos.py pedidos_legacy.py \
            root@$VPS_HOST:$DESTINO/

      - name: Reconstruir y reiniciar el panel
        run: |
          ssh -i ~/.ssh/id_vps root@$VPS_HOST \
            "cd $DESTINO && docker compose up -d --build asistente"

      - name: Verificar que responde
        run: |
          for i in $(seq 1 24); do
            if curl -fsS -o /dev/null https://produccion.cloud/salud; then echo "produccion.cloud responde"; exit 0; fi
            sleep 5
          done
          echo "produccion.cloud no respondió en 2 minutos" >&2
          exit 1

      - name: Borrar la llave del runner
        if: always()
        run: rm -f ~/.ssh/id_vps
