services:
  asistente:
    build: .
    container_name: asistente-reprogramaciones
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/data
      - /mnt/nas-indoor:/mnt/nas
      # La credencial no se versiona: se guarda solo en el VPS, dentro de ./secrets.
      - ./secrets:/run/secrets:ro
    environment:
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=moondream
    security_opt:
      - no-new-privileges:true

  caddy:
    # Imagen con el modulo DNS de Cloudflare compilado (ver Dockerfile.caddy): permite
    # validar certificados por DNS-01 en vez de HTTP-01/TLS-ALPN-01. produccion.tech lo
    # necesita porque la validacion HTTP normal de Let's Encrypt/ZeroSSL no logra conectar
    # con este VPS desde ciertas ubicaciones internacionales (problema de red, no de Caddy).
    build:
      context: .
      dockerfile: Dockerfile.caddy
    container_name: asistente-reprogramaciones-caddy
    restart: unless-stopped
    depends_on:
      - asistente
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true

  ollama:
    image: ollama/ollama:latest
    container_name: asistente-vision
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    security_opt:
      - no-new-privileges:true

  # produccion.tech vía Cloudflare Tunnel: el VPS abre la conexión hacia
  # Cloudflare (como ngrok) en vez de esperar que Cloudflare logre conectarse
  # de entrada al servidor. Esto evita el problema de alcance de red del VPS
  # (confirmado con errores 522 reales, no solo con validación de certificados).
  # Requiere ./cloudflared/<tunnel-id>.json y ./cloudflared/config.yml en el
  # servidor (no se generan automáticamente, ver documentación del túnel).
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: asistente-reprogramaciones-cloudflared
    restart: unless-stopped
    depends_on:
      - asistente
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    security_opt:
      - no-new-privileges:true

  # Segunda conexión del mismo túnel: Cloudflare reparte el tráfico entre
  # ambas automáticamente. Si una conexión se cae o se está reiniciando, la
  # otra sigue atendiendo produccion.tech sin que nadie note un corte.
  cloudflared2:
    image: cloudflare/cloudflared:latest
    container_name: asistente-reprogramaciones-cloudflared2
    restart: unless-stopped
    depends_on:
      - asistente
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
  ollama_data:
