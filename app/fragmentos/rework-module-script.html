<script>(()=>{const nav=document.querySelector('#news-toggle')?.closest('.nav-group');if(!nav)return;const panel=document.createElement('section');panel.className='panel';panel.dataset.panel='reproceso';panel.innerHTML='<div class="rework-module"><header><div><span>CONTROL DE CALIDAD</span><h2>REPROCESO</h2><p>Órdenes que requieren corrección y su motivo registrado.</p></div><button type="button" id="rework-refresh">Actualizar</button></header><div id="rework-summary" class="rework-summary">Cargando reprocesos…</div><div id="rework-cards" class="rework-cards"></div></div>';document.querySelector('main').appendChild(panel);const group=document.createElement('div');group.className='nav-group';group.innerHTML='<button class="tab" data-kind="reproceso" type="button"><span class="nav-icon">RP</span><strong>REPROCESO</strong></button>';nav.insertAdjacentElement('afterend',group);const css=document.createElement('style');css.textContent='.rework-module{display:grid;gap:16px;max-width:1440px;margin:auto}.rework-module>header{display:flex;justify-content:space-between;gap:16px;align-items:start;padding:24px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(135deg,#241515,#11150f)}.rework-module header span{color:#ff9c99;font-size:.68rem;font-weight:900;letter-spacing:.12em}.rework-module h2{margin:5px 0;font-size:1.7rem}.rework-module p{margin:0;color:var(--muted)}.rework-module button{width:auto;padding:9px 14px;background:#ef7370;color:#251111;border:0;border-radius:9px;font-weight:900}.rework-summary{padding:13px 16px;border:1px solid rgba(239,115,112,.25);border-radius:12px;background:rgba(239,115,112,.07);color:#ffd2ce}.rework-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:13px}.rework-card{display:grid;gap:12px;padding:17px;border:1px solid rgba(239,115,112,.26);border-top:3px solid #ef7370;border-radius:15px;background:linear-gradient(150deg,#211817,#10140f)}.rework-card header{display:flex;justify-content:space-between;gap:8px}.rework-card small{color:#b8c4b2;font-size:.68rem}.rework-card h3{margin:4px 0;font-size:1rem}.rework-card p{margin:0;color:#e3ebe0;white-space:pre-wrap;line-height:1.45}.rework-card footer{display:flex;justify-content:space-between;gap:8px;color:#aeb9a6;font-size:.7rem}.rework-empty{padding:42px;text-align:center;border:1px dashed #6f403d;border-radius:14px;color:#b7c0b3}@media(max-width:620px){.rework-module>header{padding:17px;flex-direction:column}.rework-module>header button{width:100%}.rework-cards{grid-template-columns:1fr}}';document.head.appendChild(css);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const box=document.querySelector('#rework-cards'),summary=document.querySelector('#rework-summary');try{const response=await fetch('/api/reproceso',{cache:'no-store'}),rows=await response.json();if(!response.ok)throw Error(rows.detail||'No fue posible cargar');summary.textContent=rows.length+' reproceso'+(rows.length===1?' activo':'s')+' registrado'+(rows.length===1?'':'s');box.innerHTML=rows.map(row=>'<article class="rework-card"><header><div><small>ORDEN</small><h3>'+esc(row.order||'Sin orden')+'</h3><small>'+esc(row.client||'Sin cliente')+'</small></div><small>'+new Date(row.created_at).toLocaleString('es-CO',{dateStyle:'medium',timeStyle:'short'})+'</small></header><div><small>PROCESO</small><p>'+esc(row.process||'Sin proceso')+'</p></div><div><small>MOTIVO</small><p>'+esc(row.reason)+'</p></div><footer><span>Registró: '+esc(row.username)+'</span><span>Fila '+esc(row.source_row)+'</span></footer></article>').join('')||'<div class="rework-empty">No hay reprocesos registrados.</div>'}catch(error){summary.textContent=error.message}}group.querySelector('button').onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===group.querySelector('button')));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x===panel));document.body.classList.remove('inicio-mode','inventory-mode','production-mode','schedule-mode','operarios-mode','cartera-mode');load()};document.querySelector('#rework-refresh').onclick=load})();</script>
